name: zone_comics
description: Zone Comics, bibliothèque personnelle Marvel et DC et prochaines sorties.
publish_to: none
version: 1.1.1+3
environment:
  sdk: '>=3.5.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.4
  url_launcher: ^6.3.2
  sqflite: 2.4.1
  path: ^1.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  image_path: assets/icon/app_icon.png
  min_sdk_android: 23
